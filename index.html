<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>OK Rooster Planner</title>

<style>
body{
font-family:Arial;
background:#f1f5f9;
margin:0;
padding:30px;
}

.panel{
background:white;
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

table{
border-collapse:collapse;
width:100%;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
}

button{
padding:10px 15px;
border-radius:8px;
border:none;
background:#0f172a;
color:white;
cursor:pointer;
}

input,select{
padding:6px;
border-radius:6px;
border:1px solid #ccc;
}

.tabs button{
background:#e2e8f0;
color:black;
margin-right:5px;
}

.tabs .active{
background:#0f172a;
color:white;
}

.red{
color:red;
font-weight:bold;
}

.badge{
background:#e2e8f0;
padding:4px 8px;
border-radius:6px;
font-size:12px;
}
</style>

</head>
<body>

<div class="panel">

<h1>OK Rooster Planner</h1>

<select id="block"></select>
<select id="week">
<option value="1">Week 1</option>
<option value="2">Week 2</option>
</select>

<button onclick="refreshRoster()">Refresh rooster</button>
<button onclick="save()">Opslaan</button>
<button onclick="exportExcel()">Export Excel</button>

</div>

<div class="tabs">
<button onclick="tab('week')" id="tab_week">Weektemplate</button>
<button onclick="tab('rotation')" id="tab_rotation">Roulatie</button>
<button onclick="tab('employees')" id="tab_employees">Medewerkers</button>
<button onclick="tab('skills')" id="tab_skills">Competenties</button>
<button onclick="tab('dashboard')" id="tab_dashboard">Dashboard</button>
</div>

<div id="content"></div>

<script>

const SERVICES=["HCK","ADE","OK1","OK2","OK4"];
const DAYS=["Ma","Di","Wo","Do","Vr"];

const STORAGE="okplanner_v1";

let employees=[
{name:"Gordon",pref:"08:00",off:"Ma"},
{name:"Lyon",pref:"08:00",off:"Do"},
{name:"Elena",pref:"08:00",off:"Vr"},
{name:"Murphy",pref:"07:00",off:"Wo"},
{name:"Jelle",pref:"Flexibel",off:"Do"},
{name:"Roy",pref:"07:00",off:"Ma"},
{name:"Jerico",pref:"Flexibel",off:"Ma"},
{name:"Grada",pref:"08:00",off:""},
{name:"Joelle",pref:"08:00",off:""}
];

let skills={
Gordon:{OK1:"Groen",OK2:"Groen",OK4:"Oranje"},
Lyon:{OK1:"Groen",OK2:"Groen",OK4:"Groen"},
Elena:{OK1:"Rood",OK2:"Groen",OK4:"Rood"},
Murphy:{OK1:"Rood",OK2:"Rood",OK4:"Groen"},
Jelle:{OK1:"Groen",OK2:"Groen",OK4:"Groen"},
Roy:{OK1:"Groen",OK2:"Groen",OK4:"Groen"},
Jerico:{OK1:"Groen",OK2:"Groen",OK4:"Groen"},
Grada:{OK1:"Groen"},
Joelle:{OK1:"Groen"}
};

let rotation=[];

function generateRotation(){

rotation=[];

let people=employees.map(e=>e.name);

for(let block=1;block<=26;block++){

let p=people.slice(block%people.length)
.concat(people.slice(0,block%people.length));

rotation.push({
block,
week:1,
HCK:p[0],
ADE:p[1],
OK1:p[2],
OK2:p[3],
OK4:p[4],
flex1:p[5],
flex2:p[6]
});

rotation.push({
block,
week:2,
HCK:p[1],
ADE:p[2],
OK1:p[3],
OK2:p[4],
OK4:p[5],
flex1:p[6],
flex2:p[7]
});

}

}

function refreshRoster(){
generateRotation();
render();
}

function tab(t){

document.querySelectorAll(".tabs button")
.forEach(b=>b.classList.remove("active"));

document.getElementById("tab_"+t).classList.add("active");

currentTab=t;

render();
}

let currentTab="week";

function render(){

if(currentTab==="week") renderWeek();
if(currentTab==="rotation") renderRotation();
if(currentTab==="employees") renderEmployees();
if(currentTab==="skills") renderSkills();
if(currentTab==="dashboard") renderDashboard();

}

function renderWeek(){

let block=document.getElementById("block").value||1;
let week=document.getElementById("week").value||1;

let r=rotation.find(x=>x.block==block&&x.week==week);

let html="<div class='panel'><table>";

html+="<tr><th>Dag</th>";

SERVICES.forEach(s=>html+="<th>"+s+"</th>");

html+="<th>Flex1</th><th>Flex2</th></tr>";

DAYS.forEach(d=>{

html+="<tr><td>"+d+"</td>";

SERVICES.forEach(s=>{
html+="<td>"+r[s]+"</td>";
});

html+="<td>"+r.flex1+"</td>";
html+="<td>"+r.flex2+"</td>";

html+="</tr>";

});

html+="</table></div>";

document.getElementById("content").innerHTML=html;

}

function renderRotation(){

let html="<div class='panel'><table>";

html+="<tr><th>Blok</th><th>Week</th>";

SERVICES.forEach(s=>html+="<th>"+s+"</th>");

html+="<th>Flex1</th><th>Flex2</th></tr>";

rotation.forEach(r=>{

html+="<tr>";

html+="<td>"+r.block+"</td>";
html+="<td>"+r.week+"</td>";

SERVICES.forEach(s=>{
html+="<td>"+r[s]+"</td>";
});

html+="<td>"+r.flex1+"</td>";
html+="<td>"+r.flex2+"</td>";

html+="</tr>";

});

html+="</table></div>";

document.getElementById("content").innerHTML=html;

}

function renderEmployees(){

let html="<div class='panel'><table>";

html+="<tr><th>Naam</th><th>Voorkeur</th><th>Vrije dag</th></tr>";

employees.forEach(e=>{

html+="<tr>";

html+="<td>"+e.name+"</td>";
html+="<td>"+e.pref+"</td>";
html+="<td>"+e.off+"</td>";

html+="</tr>";

});

html+="</table></div>";

document.getElementById("content").innerHTML=html;

}

function renderSkills(){

let html="<div class='panel'><table>";

html+="<tr><th>Naam</th>";

SERVICES.forEach(s=>html+="<th>"+s+"</th>");

html+="</tr>";

employees.forEach(e=>{

html+="<tr>";

html+="<td>"+e.name+"</td>";

SERVICES.forEach(s=>{
html+="<td>"+(skills[e.name]?.[s]||"")+"</td>";
});

html+="</tr>";

});

html+="</table></div>";

document.getElementById("content").innerHTML=html;

}

function renderDashboard(){

let counts={};

rotation.forEach(r=>{
SERVICES.forEach(s=>{
counts[r[s]]=(counts[r[s]]||0)+1;
});
});

let html="<div class='panel'><table>";

html+="<tr><th>Naam</th><th>Diensten</th></tr>";

Object.entries(counts).forEach(([name,c])=>{
html+="<tr><td>"+name+"</td><td>"+c+"</td></tr>";
});

html+="</table></div>";

document.getElementById("content").innerHTML=html;

}

function save(){

localStorage.setItem(STORAGE,
JSON.stringify({employees,skills,rotation}));

alert("Opgeslagen");

}

function load(){

let data=localStorage.getItem(STORAGE);

if(data){

let d=JSON.parse(data);

employees=d.employees;
skills=d.skills;
rotation=d.rotation;

}else{
generateRotation();
}

}

function exportExcel(){

let csv="Blok,Week,HCK,ADE,OK1,OK2,OK4,Flex1,Flex2\n";

rotation.forEach(r=>{
csv+=`${r.block},${r.week},${r.HCK},${r.ADE},${r.OK1},${r.OK2},${r.OK4},${r.flex1},${r.flex2}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="rooster.csv";
a.click();

}

for(let i=1;i<=26;i++){

let opt=document.createElement("option");
opt.value=i;
opt.innerText="Blok "+i;

document.getElementById("block").appendChild(opt);

}

load();

tab("week");

</script>

</body>
</html>
